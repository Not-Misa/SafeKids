<div class="main">
  <div class="image-container">
    <img src="assets/images/SafeKids_Logo.jpeg" alt="Logo de SafeKids" />
  </div>

  <div class="backgroundform-container">
    <h1 class="greetting">Bienvenido a SafeKids!</h1>

    <form class="form-container" (ngSubmit)="sessionStart()">
      <h1 class="header-session">Inicio de sesión</h1>

      @if (mensajeInformativo) {
        <p class="login-success" role="status">{{ mensajeInformativo }}</p>
      }

      <div class="input-form"><label for="user">Usuario:</label> <br /></div>

      <div class="wrapper-form">
        <img src="assets/icons/user-circle.svg" alt="Usuario" class="icon" />
        <input
          type="text"
          id="usuario"
          name="usuario"
          [(ngModel)]="userInput"
          placeholder="Ingrese su usuario..."
          required
        />
      </div>

      <div class="input-form">
        <label for="password">Contraseña:</label>
      </div>

      <div class="wrapper-form">
        <img src="assets/icons/lock.svg" alt="Contraseña" class="icon" />
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="passwordInput"
          placeholder="Ingrese su contraseña..."
          required
        />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Entrando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
